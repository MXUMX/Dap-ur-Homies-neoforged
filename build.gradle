plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom configurations.implementation
configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly

repositories {
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }
}

neoForge {
    version = project.neoforge_version
    addModdingDependenciesTo(sourceSets.gameTest)
    mods {
        coopmoves {
            sourceSet sourceSets.main
        }
        coopmoves_tests {
            sourceSet sourceSets.gameTest
        }
    }
    runs {
        client {
            client()
            gameDirectory = file('build/run-26.2/client')
            loadedMods = [mods.coopmoves]
        }
        server {
            server()
            programArgument "--nogui"
            gameDirectory = file('build/run-26.2/server')
            loadedMods = [mods.coopmoves]
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/run-26.2/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'coopmoves_tests'
        }
    }
}

dependencies {
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${project.pal_version}") {
        // These libraries are supplied and version-locked by Minecraft.
        exclude group: 'org.slf4j'
        exclude group: 'it.unimi.dsi'
        exclude group: 'io.netty'
        exclude group: 'org.joml'
        exclude group: 'com.google.code.gson'
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        maven {
            name = "RedlanceMinecraft"
            url = uri("https://repo.redlance.org/public")
        }
    }
}
